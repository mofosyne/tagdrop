plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.ksp)
}

// Copies the repo-root SPEC.md into a generated raw resource on every build, so the in-app
// "Wire Format Spec" screen (SpecActivity) always shows the exact same text as SPEC.md —
// never a manually-maintained copy that can silently drift out of sync.
def specRawResDir = layout.buildDirectory.dir("generated/specRawRes")
tasks.register("copySpecToRawRes", Copy) {
    from(rootProject.file("SPEC.md"))
    into(specRawResDir.map { it.dir("raw") })
    rename { "spec.md" }
}

// QDEF-SPEC.md itself is just a short pointer to the real, always-current spec at
// mofosyne/qdef (kept that way deliberately -- a hand-maintained full copy here just
// drifts, see its own header and CLAUDE.md). For the in-app viewer to still show real
// content offline, this bundles QDEF-SPEC-cached.md instead -- a periodically refreshed
// mirror, updated by running `scripts/sync-qdef-spec.sh` and committing the result (not
// fetched at build time: keeps builds hermetic/offline-safe and avoids depending on
// GitHub being reachable from wherever ./gradlew happens to run). Falls back to the
// pointer file itself if the cache is ever missing, so a fresh checkout still builds.
def qdefSpecCacheFile = rootProject.file("QDEF-SPEC-cached.md")
def qdefSpecRawResDir = layout.buildDirectory.dir("generated/qdefSpecRawRes")
tasks.register("copyQdefSpecToRawRes", Copy) {
    from(qdefSpecCacheFile.exists() ? qdefSpecCacheFile : rootProject.file("QDEF-SPEC.md"))
    into(qdefSpecRawResDir.map { it.dir("raw") })
    rename { "qdef_spec.md" }
}

// Bundles docs/db/sources.json -- the same file "Browse recommended sources" fetches live from
// mofosyne.github.io/tagdrop/db/sources.json -- as a raw resource, so fresh-install seeding and
// "Reload default sources" read the exact same directory instead of a separately hand-maintained
// hardcoded list that can silently drift from it.
def sourcesJsonRawResDir = layout.buildDirectory.dir("generated/sourcesJsonRawRes")
tasks.register("copySourcesJsonToRawRes", Copy) {
    from(rootProject.file("docs/db/sources.json"))
    into(sourcesJsonRawResDir.map { it.dir("raw") })
    rename { "default_sources.json" }
}

android {
    namespace = 'com.github.mofosyne.tagdrop'
    compileSdk = 35

    defaultConfig {
        applicationId = "com.github.mofosyne.tagdrop"
        minSdk = 23
        targetSdk = 35
        versionCode = 10
        versionName = "2.5.0"
    }

    buildFeatures {
        viewBinding = true
    }

    sourceSets {
        main {
            res.srcDirs += specRawResDir
            res.srcDirs += qdefSpecRawResDir
            res.srcDirs += sourcesJsonRawResDir
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("copySpecToRawRes")
    dependsOn("copyQdefSpecToRawRes")
    dependsOn("copySourcesJsonToRawRes")
}

dependencies {
    implementation libs.androidx.activity
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.cardview
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx

    // Room database for found-cache collection
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    // ZXing embedded scanner (no separate app required)
    implementation libs.zxing.android.embedded
    implementation libs.zxing.core

    // OSMDroid map (OpenStreetMap tiles — no API key or Play Services required)
    implementation libs.osmdroid.android

    // Markdown rendering for text/markdown content (pure Kotlin/Java, no native deps)
    implementation libs.commonmark
    // GFM pipe-table support — SPEC.md (rendered in-app by SpecActivity) relies on tables
    implementation libs.commonmark.ext.gfm.tables

    // SVG rendering for image/svg+xml thumbnails (BitmapFactory can't decode XML)
    implementation libs.androidsvg

    // ML-DSA-44 post-quantum signatures (SPEC §10) — not available in java.security/Android's
    // own crypto providers, mirrors the web tools' @noble/post-quantum dependency.
    implementation libs.bouncycastle.bcprov

    // Keystore-wrapped at-rest storage for the local signing identity's private key (SPEC §10)
    // — the first use of secure storage in this app (RetainedKey's AES keys are plain SQLite
    // columns, an acceptable risk for a shared decryption secret but not for a personal signing
    // identity: leaking it lets an attacker forge signatures under this signer_id indefinitely).
    implementation libs.androidx.security.crypto

    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    testImplementation libs.junit
}
