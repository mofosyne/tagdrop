name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-tools-roundtrip:
    name: Web tools QR round-trip test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install dependencies
        working-directory: tools
        run: npm ci

      - name: Run round-trip test
        working-directory: tools
        run: npm test

      # Adversarial/validation coverage the round-trip test above doesn't exercise
      # (tamper detection via group_id/root_hash, SPEC §2.2 even/odd key criticality,
      # key-only codes) — see the file's own header comment for why it's kept separate.
      - name: Run QDEF encode/decode validation suite
        working-directory: tools
        run: npm run test:qdef

      # Independent second check on the same fixtures test:qdef just regenerated, using
      # qdef-lint.cjs (vendored from mofosyne/qdef, shares no code with our own encoders) —
      # catches grammar/canonical-encoding issues our own tests wouldn't self-consistently miss.
      - name: Run independent qdef-lint grammar/footgun check
        working-directory: tools
        run: npm run lint:qdef

      # Same lint but through the carrier framing (QDEF magic header) that the examples
      # page and byte-mode QR path actually use — confirms the magic is present and the
      # framed container is well-formed, not just the bare logical codes.
      - name: Run framed QDEF-lint check (examples/binary QR path)
        working-directory: tools
        run: npm run lint:examples

  test-and-build:
    name: Unit tests & APK builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Caches the Gradle wrapper (~140 MB) and the build cache between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Always upload the HTML report so failures are readable in the
      # Actions UI even when the test step itself fails.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Mirrors the unsigned release build F-Droid's build server produces
      # (and then signs with its own key), to catch release-only build issues.
      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
